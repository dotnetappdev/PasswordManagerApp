<body style="background-color: #1A1A1A;">

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        // Login-page helpers invoked by the shared Login component (mirrors VaultGuard.Web/Components/App.razor).
        window.focusPasswordField = function () {
            try {
                var el = document.querySelector('.auth-card input[type="password"]')
                      || document.querySelector('input[type="password"]');
                if (el) el.focus();
            } catch (e) { /* non-fatal */ }
        };
        window.animateLogo = function () { /* logo animation is CSS-driven; no-op */ };
    </script>
