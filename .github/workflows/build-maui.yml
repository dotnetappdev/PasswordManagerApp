name: Build MAUI

on:
  push:
    branches: [ devmain, main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ devmain, main ]
  workflow_dispatch: {}

# Serializes runs for the same PR/branch (default cancel-in-progress: false, so a build already in
# flight is queued behind, never killed). Without this, two pushes to the same open PR in quick
# succession can both check out before either has pushed its own release tag - both then compute the
# same "next" release-vX.Y.Z and race to push it, and the loser fails with "tag already exists".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  # See build-wpf.yml's permissions comment - the "Tag release and create release branch" step
  # below needs this whenever the tagged commit touches .github/workflows/**.
  workflows: write

env:
  PROJECT: VaultGuard.App/VaultGuard.App.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Explicit ref + full history: pull_request's default checkout is a synthetic merge commit that
      # doesn't exist in the branch's real history (bad tag target), and the release version-bump
      # below needs the full tag history, not the default shallow clone.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      # The csproj multi-targets net10.0-android;net10.0-windows10.0.19041.0 on Windows runners, and
      # this only needs to validate the Windows head (and, transitively, the shared Blazor UI it
      # hosts). The RID for the Windows TFM is set inside the csproj itself, conditioned on
      # $(TargetFramework), so it can't leak into the Android inner-build's own restore - passing it
      # via CLI here (-r/-p:RuntimeIdentifier=) applies it project-wide and makes Android's restore
      # look for a nonexistent win-x64 flavored Mono runtime pack (NU1102).
      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release -f net10.0-windows10.0.19041.0

      # ── Android release: on a merged PR into devmain (auto-versioned, shared release-vX.Y.Z tag -
      # see build-wpf.yml's "Set version" comment) or a manual vX.Y.Z tag push. Gated separately from
      # the Windows-head build above so it never affects that build's own trigger scope. ──────
      - name: Compute release version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devmain')
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v(.+)$ ]]; then
            ver="${BASH_REMATCH[1]}"
            tag="${{ github.ref_name }}"
          else
            latest=$(git tag -l 'release-v*' | sed 's/^release-v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
            if [ -z "$latest" ]; then
              ver="1.0.0"
            else
              IFS='.' read -r major minor patch <<< "$latest"
              ver="$major.$minor.$((patch + 1))"
            fi
            tag="release-v$ver"
          fi
          echo "Resolved version: $ver (tag: $tag)"
          echo "VERSION=$ver" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"

      # No signing key is configured (see VaultGuard.App.csproj) - the SDK auto-generates a debug
      # keystore, so this APK installs fine sideloaded ("install unknown apps") but isn't Play-Store
      # signed. -f net10.0-android only (no -r/-p:RuntimeIdentifier) keeps this from leaking a Windows
      # RID into Android's own restore, per the Build step's comment above.
      - name: Publish Android APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devmain')
        run: >
          dotnet publish ${{ env.PROJECT }} -f net10.0-android --configuration Release
          -p:Version=${{ steps.ver.outputs.VERSION }}
          --output publish/android

      # Only for the PR-merge case - a manual vX.Y.Z tag already exists (the user pushed it), so there's
      # nothing to tag here; the release step below just attaches the APK to that existing tag's release.
      # release-vX.Y.Z is shared with WPF/Web/API (see build-wpf.yml's "Tag release" step comment) -
      # this checks whether a sibling job already pushed it and skips instead of failing if so.
      - name: Tag release and create release branch
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devmain'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sha="${{ github.event.pull_request.head.sha }}"
          tag="${{ steps.ver.outputs.TAG }}"
          git fetch origin "refs/tags/$tag" 2>/dev/null || true
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists (created by a sibling app's release job for this same merge) - skipping."
          else
            git tag "$tag" "$sha"
            git push origin "$tag"
          fi
          git fetch origin "refs/heads/release/$tag" 2>/dev/null || true
          if git rev-parse "refs/remotes/origin/release/$tag" >/dev/null 2>&1; then
            echo "release/$tag branch already exists - skipping."
          else
            git branch "release/$tag" "$sha"
            git push origin "release/$tag"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devmain')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: VaultGuard ${{ steps.ver.outputs.VERSION }}
          append_body: true
          body: |
            ### Android — v${{ steps.ver.outputs.VERSION }}
            - `com.dotnetappdevni.passwordmanager.app-Signed.apk` — sideload APK (unsigned/debug key, not Play-Store signed)
          files: publish/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
