name: Build MAUI

on:
  push:
    branches: [ devmain, main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ devmain, main ]

env:
  PROJECT: VaultGuard.App/VaultGuard.App.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      # The csproj multi-targets net10.0-android;net10.0-windows10.0.19041.0 on Windows runners, and
      # this only needs to validate the Windows head (and, transitively, the shared Blazor UI it
      # hosts). No separate "dotnet restore" step here on purpose: "dotnet restore" has no -f option
      # and forwards it to MSBuild as a stray positional (MSB1008); a -p:TargetFrameworks= override
      # "works" for parsing but cascades into every ProjectReference too, breaking their own
      # single-target restore (NETSDK1005); and a bare -r win-x64 with no TFM scoping gets applied to
      # every inner build including Android's, which then looks for a nonexistent
      # Microsoft.NETCore.App.Runtime.Mono.win-x64 package (NU1102). "dotnet build -f ... -r ..." does
      # its own implicit restore scoped correctly to that one inner build, avoiding all three.
      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release -f net10.0-windows10.0.19041.0 -r win-x64
