name: Build MAUI

on:
  push:
    branches: [ devmain, main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ devmain, main ]

env:
  PROJECT: VaultGuard.App/VaultGuard.App.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      # The csproj multi-targets net10.0-android;net10.0-windows10.0.19041.0 on Windows runners. A
      # bare -r win-x64 applies the RID to every inner build, including Android's - which then tries
      # to resolve a nonexistent Microsoft.NETCore.App.Runtime.Mono.win-x64 package (NU1102). Override
      # the plural -p:TargetFrameworks= (the property the outer build actually reads to decide which
      # inner builds to run at all) to scope restore/build to just the Windows TFM, so the RID is only
      # ever applied there. "dotnet restore" has no -f/--framework option (unlike "dotnet build") -
      # passing it gets forwarded to MSBuild as a second positional project argument (MSB1008).
      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r win-x64

      # The csproj targets net10.0-windows when building on Windows, so this validates the
      # Windows head of the MAUI app (and, transitively, the shared Blazor UI it hosts).
      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release --no-restore -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r win-x64
