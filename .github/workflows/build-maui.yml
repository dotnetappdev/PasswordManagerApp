name: Build MAUI

on:
  push:
    branches: [ devmain, main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ devmain, main ]

env:
  PROJECT: VaultGuard.App/VaultGuard.App.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      # The csproj multi-targets net10.0-android;net10.0-windows10.0.19041.0 on Windows runners, and
      # without a RID, NuGet never resolves the win-x64 runtime pack the Windows head needs
      # (NETSDK1112). Use -r|--runtime (not a -p:TargetFramework= override, which the outer restore
      # loop ignores when scoping which TFM's RID-specific assets get restored) - "dotnet restore"
      # also doesn't accept the -f framework shorthand at all (it gets forwarded to MSBuild as a
      # second positional argument, MSB1008), unlike "dotnet build".
      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -r win-x64

      # The csproj targets net10.0-windows when building on Windows, so this validates the
      # Windows head of the MAUI app (and, transitively, the shared Blazor UI it hosts).
      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release --no-restore -f net10.0-windows10.0.19041.0 -r win-x64
