name: Build MAUI

on:
  push:
    branches: [ devmain, main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ devmain, main ]

env:
  PROJECT: VaultGuard.App/VaultGuard.App.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      # The csproj multi-targets net10.0-android;net10.0-windows10.0.19041.0 on Windows runners, and
      # this only needs to validate the Windows head (and, transitively, the shared Blazor UI it
      # hosts). The RID for the Windows TFM is set inside the csproj itself, conditioned on
      # $(TargetFramework), so it can't leak into the Android inner-build's own restore - passing it
      # via CLI here (-r/-p:RuntimeIdentifier=) applies it project-wide and makes Android's restore
      # look for a nonexistent win-x64 flavored Mono runtime pack (NU1102).
      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release -f net10.0-windows10.0.19041.0
