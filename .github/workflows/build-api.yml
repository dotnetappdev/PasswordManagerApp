name: Build API

on:
  push:
    branches: [ devmain, main, develop ]
    tags:     [ 'v*' ]
    paths:
      - 'VaultGuard.API/**'
      - 'VaultGuard.Models/**'
      - 'VaultGuard.DAL/**'
      - 'VaultGuard.Services/**'
      - 'VaultGuard.Crypto/**'
      - 'VaultGuard.DAL.SqlServer/**'
      - 'VaultGuard.DAL.MySql/**'
      - 'VaultGuard.DAL.Postgres/**'
      - 'VaultGuard.DAL.SupaBase/**'
  pull_request:
    branches: [ devmain, main, develop ]
    paths:
      - 'VaultGuard.API/**'
      - 'VaultGuard.Models/**'
      - 'VaultGuard.DAL/**'
      - 'VaultGuard.Services/**'
      - 'VaultGuard.Crypto/**'
      - 'VaultGuard.DAL.SqlServer/**'
      - 'VaultGuard.DAL.MySql/**'
      - 'VaultGuard.DAL.Postgres/**'
      - 'VaultGuard.DAL.SupaBase/**'

env:
  PROJECT: VaultGuard.API/VaultGuard.API.csproj
  PUBLISH_DIR: publish/api
  DOTNET_VERSION: '10.0.x'

jobs:
  build-api:
    runs-on: ubuntu-latest
    name: Build & Publish API

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set version
        id: ver
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v(.+)$ ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: >
          dotnet build ${{ env.PROJECT }}
          --no-restore --configuration Release
          -p:Version=${{ steps.ver.outputs.VERSION }}

      - name: Test
        run: |
          if [ -d "VaultGuard.API.Tests" ]; then
            dotnet test VaultGuard.API.Tests --no-build --configuration Release
          else
            echo "No API tests found, skipping"
          fi

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration Release --output ${{ env.PUBLISH_DIR }}
          -p:Version=${{ steps.ver.outputs.VERSION }}

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd ${{ env.PUBLISH_DIR }}
          zip -r ../VaultGuardAPI-${{ steps.ver.outputs.VERSION }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VaultGuard-API-${{ steps.ver.outputs.VERSION }}
          path: publish/VaultGuardAPI-*.zip
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: VaultGuard ${{ steps.ver.outputs.VERSION }}
          generate_release_notes: true
          files: publish/VaultGuardAPI-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
