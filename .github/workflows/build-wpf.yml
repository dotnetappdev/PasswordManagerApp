name: Build WPF (Windows)

on:
  push:
    branches: [ devmain, main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ devmain, main ]
  workflow_dispatch: {}

# Cancels a build already in flight for the same PR/branch when a new push arrives, instead of
# queuing behind it - without this, two pushes to the same open PR in quick succession can both
# check out before either has pushed its own release tag/screenshot commit, both then compute the
# same "next" release-vX.Y.Z and race to push it (the loser fails with "tag already exists"), and
# every push leaves one more stale, already-superseded run still grinding away in the queue behind
# newer ones. Killing the old run outright avoids both: there's only ever one active run per ref,
# so it can't race itself, and CI reflects the latest push promptly instead of working through a
# backlog of runs nobody cares about anymore.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT: VaultGuard.WPF/VaultGuard.WPF.csproj
  PUBLISH_DIR: publish/wpf
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Explicit ref + full history: pull_request's default checkout is a synthetic merge commit that
      # doesn't exist in the branch's real history (bad tag target), and the release version-bump
      # below needs the full tag history, not the default shallow clone.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── Derive version: from a git tag (v1.2.3), auto-incremented from the latest release-vX.Y.Z tag
      # on a merged PR into devmain, or 0.0.0-dev otherwise (plain branch pushes/other PRs - build
      # validation only, no release). release-vX.Y.Z is the ONE shared tag/version every app
      # (WPF/Android/Web/API) publishes under - see deploy-api/web-smarterasp.yml and build-maui.yml,
      # which compute this identically. All four jobs read this tag family early (before any of them
      # has pushed a new one for this same merge), so they agree on the same next version without any
      # cross-workflow coordination - see the "Tag release" step below for how the actual tag push
      # stays safe if two of them race anyway. ─────────────────────────────────────────────────────
      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v(.+)$ ]]; then
            ver="${BASH_REMATCH[1]}"
            tag="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.base.ref }}" = "devmain" ]; then
            latest=$(git tag -l 'release-v*' | sed 's/^release-v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
            if [ -z "$latest" ]; then
              ver="1.0.0"
            else
              IFS='.' read -r major minor patch <<< "$latest"
              ver="$major.$minor.$((patch + 1))"
            fi
            tag="release-v$ver"
          else
            ver="0.0.0-dev"
            tag=""
          fi
          echo "VERSION=$ver" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $ver (tag: $tag)"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        # Only -p:Version is set here - the SDK derives AssemblyVersion/FileVersion from it
        # automatically (stripping any -suffix, e.g. "-dev"), since those two MSBuild properties
        # feed [AssemblyVersion]/[AssemblyFileVersion] attributes which require a purely numeric
        # major[.minor[.build[.revision]]] value and would fail to compile (CS7034) otherwise.
        run: >
          dotnet build ${{ env.PROJECT }}
          --configuration Release
          --no-restore
          -p:Version=${{ steps.ver.outputs.VERSION }}

      # Framework-dependent (not self-contained): was bundling the entire .NET runtime into every
      # installer (~66MB for a WPF app that's a few MB of actual code), and once installer/setup.wxs
      # got fixed to actually include every publish file (previously just 2 hardcoded ones), the MSI
      # would have jumped to the same size. Both installers now check for/guide the user to the
      # required runtime instead of carrying their own private copy of it - see setup.iss's
      # InitializeSetup and setup.wxs's LaunchCondition.
      - name: Publish (framework-dependent win-x64)
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ${{ env.PUBLISH_DIR }}
          -p:Version=${{ steps.ver.outputs.VERSION }}

      # ── EXE Installer (Inno Setup) ────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build EXE installer
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.VERSION }}"
          # Inno Setup resolves a relative [Files] Source against the .iss script's own directory
          # (installer/), not the working directory iscc was invoked from - so PUBLISH_DIR ("publish/wpf",
          # relative to the repo root) must be made absolute before being passed in.
          $publishDir = (Resolve-Path "${{ env.PUBLISH_DIR }}").Path
          iscc /DMyAppVersion=$ver /DPublishDir="$publishDir" installer/setup.iss
          echo "EXE_PATH=$(Get-Item installer/output/*.exe | Select-Object -ExpandProperty FullName)" >> $env:GITHUB_OUTPUT
        id: exe

      # ── MSI Installer (WiX v4) ────────────────────────────────────────────
      - name: Install WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.*
          # Pin the extension to the same version as the CLI - an unpinned "wix extension add"
          # grabs the latest package (e.g. a v7 build), which the v4 CLI can't load (WIX0144).
          $wixVersion = (wix --version).Trim()
          wix extension add "WixToolset.UI.wixext/$wixVersion"

      - name: Build MSI
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.VERSION }}"
          # Same relative-path gotcha as the Inno Setup step above: wix resolves a relative
          # Source/PublishDir against setup.wxs's own directory (installer/), not the repo root.
          $publishDir = (Resolve-Path "${{ env.PUBLISH_DIR }}").Path
          wix build installer/setup.wxs `
            -ext WixToolset.UI.wixext `
            -d Version=$ver `
            -d PublishDir="$publishDir" `
            -o "installer/output/VaultGuardSetup-$ver.msi"
          echo "MSI_PATH=installer/output/VaultGuardSetup-$ver.msi" >> $env:GITHUB_OUTPUT
        id: msi

      # ── Upload artifacts for PRs / branch builds ─────────────────────────
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: VaultGuard-EXE-${{ steps.ver.outputs.VERSION }}
          path: installer/output/*.exe

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: VaultGuard-MSI-${{ steps.ver.outputs.VERSION }}
          path: installer/output/*.msi

      # ── Publish to GitHub Releases: manual vX.Y.Z tag push, or a merged PR into devmain ──────────
      # Only the PR-merge case needs a new tag - a manual vX.Y.Z tag already exists (the user pushed
      # it), so there's nothing to create here; the release step below just attaches the installers to
      # that existing tag's release. release-vX.Y.Z is shared with Android/Web/API (see "Set version"
      # above) - all four jobs try to create the same tag/branch for this merge, so this checks
      # whether a sibling job already pushed it (re-fetching tags first to see their latest push, not
      # just what this job's own checkout had) and skips instead of failing if so.
      #
      # GitHub unconditionally refuses to let the default GITHUB_TOKEN create/update ANY ref (tag or
      # branch) that points at a commit touching .github/workflows/** ("refusing to allow a GitHub App
      # to create or update workflow ... without `workflows` permission") - there is no permission that
      # grants this to GITHUB_TOKEN (confirmed: adding `workflows: write` to this file's `permissions:`
      # isn't a recognized scope and makes the whole workflow fail to parse). So every push below is
      # best-effort: if it's rejected for this reason, warn and move on rather than failing the job -
      # the GitHub Release step still runs and still gets its files attached even without this tag/
      # branch existing (softprops/action-gh-release creates the tag itself via the Releases API).
      - name: Tag release and create release branch
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devmain'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sha="${{ github.event.pull_request.head.sha }}"
          tag="${{ steps.ver.outputs.TAG }}"
          git fetch origin "refs/tags/$tag" 2>/dev/null || true
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists (created by a sibling app's release job for this same merge) - skipping."
          else
            git tag "$tag" "$sha"
            if ! git push origin "$tag"; then
              echo "::warning::Could not push tag $tag (likely blocked because this commit touches .github/workflows/** - see this step's comment). Continuing; the release step will create it via the API instead."
            fi
          fi
          git fetch origin "refs/heads/release/$tag" 2>/dev/null || true
          if git rev-parse "refs/remotes/origin/release/$tag" >/dev/null 2>&1; then
            echo "release/$tag branch already exists - skipping."
          else
            git branch "release/$tag" "$sha"
            if ! git push origin "release/$tag"; then
              echo "::warning::Could not push branch release/$tag (likely blocked because this commit touches .github/workflows/** - see this step's comment)."
            fi
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devmain')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: VaultGuard ${{ steps.ver.outputs.VERSION }}
          generate_release_notes: true
          append_body: true
          body: |
            ### Windows Desktop (WPF) — v${{ steps.ver.outputs.VERSION }}
            - `VaultGuardSetup-${{ steps.ver.outputs.VERSION }}.exe` — EXE installer (Inno Setup)
            - `VaultGuardSetup-${{ steps.ver.outputs.VERSION }}.msi` — MSI installer (WiX)
          files: |
            installer/output/*.exe
            installer/output/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
