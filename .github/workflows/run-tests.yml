name: Unit Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/run-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/run-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Unit Tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build test projects
      run: |
        dotnet build PasswordManager.App.Tests/PasswordManager.App.Tests.csproj --no-restore --configuration Release
        dotnet build PasswordManager.Web.Tests/PasswordManager.Web.Tests.csproj --no-restore --configuration Release
        dotnet build PasswordManager.WinUi.Tests/PasswordManager.WinUi.Tests.csproj --no-restore --configuration Release
    
    - name: Run App Tests
      run: dotnet test PasswordManager.App.Tests/PasswordManager.App.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=app-tests.trx"
    
    - name: Run Web Tests
      run: dotnet test PasswordManager.Web.Tests/PasswordManager.Web.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=web-tests.trx"
    
    - name: Run WinUI Tests
      run: dotnet test PasswordManager.WinUi.Tests/PasswordManager.WinUi.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=winui-tests.trx"
    
    - name: Run Backend Tests
      run: |
        if [ -d "PasswordManager.BackEnd.Tests" ]; then
          dotnet test PasswordManager.BackEnd.Tests/PasswordManager.BackEnd.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=backend-tests.trx"
        fi
    
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results
        path: '**/*.trx'
        reporter: dotnet-trx
        fail-on-error: true
