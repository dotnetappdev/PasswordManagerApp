name: Unit Tests

on:
  push:
    branches: [ devmain, main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/run-tests.yml'
  pull_request:
    branches: [ devmain, main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/run-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Unit Tests

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '9.0.x'

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # Restore only the test projects, not the whole VaultGuard.sln - a bare "dotnet restore" picks up
    # the solution file, which includes VaultGuard.App (MAUI) and needs the maui-android workload
    # installed (NETSDK1147), which this runner doesn't have.
    - name: Restore dependencies
      run: |
        dotnet restore VaultGuard.App.Tests/VaultGuard.App.Tests.csproj
        dotnet restore VaultGuard.Web.Tests/VaultGuard.Web.Tests.csproj
        dotnet restore VaultGuard.WinUi.Tests/VaultGuard.WinUi.Tests.csproj
        dotnet restore VaultGuard.BackEnd.Tests/VaultGuard.BackEnd.Tests.csproj

    - name: Build test projects
      run: |
        dotnet build VaultGuard.App.Tests/VaultGuard.App.Tests.csproj --no-restore --configuration Release
        dotnet build VaultGuard.Web.Tests/VaultGuard.Web.Tests.csproj --no-restore --configuration Release
        dotnet build VaultGuard.WinUi.Tests/VaultGuard.WinUi.Tests.csproj --no-restore --configuration Release
        dotnet build VaultGuard.BackEnd.Tests/VaultGuard.BackEnd.Tests.csproj --no-restore --configuration Release

    - name: Run App Tests
      run: dotnet test VaultGuard.App.Tests/VaultGuard.App.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=app-tests.trx"

    - name: Run Web Tests
      run: dotnet test VaultGuard.Web.Tests/VaultGuard.Web.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=web-tests.trx"

    - name: Run WinUI Tests
      run: dotnet test VaultGuard.WinUi.Tests/VaultGuard.WinUi.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=winui-tests.trx"

    - name: Run Backend Tests
      if: always()
      run: |
        if [ -d "VaultGuard.BackEnd.Tests" ]; then
          dotnet test VaultGuard.BackEnd.Tests/VaultGuard.BackEnd.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=backend-tests.trx"
        fi

    - name: Publish Test Results
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Unit Test Results
        path: '**/*.trx'
        reporter: dotnet-trx
        fail-on-error: true

    - name: Collect Allure results
      if: always()
      run: |
        mkdir -p allure-results
        find . -type d -name allure-results -not -path './allure-results' -exec sh -c 'cp -f "$1"/*.json allure-results/ 2>/dev/null || true' _ {} \;
        echo "Collected $(find allure-results -type f | wc -l) Allure result files"

    - name: Get Allure history
      uses: actions/checkout@v7
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    # report_url overrides the base URL the action uses to build allure-history/index.html's redirect.
    # Without it, the action assumes the report is published at the repo root and generates
    # ".../PasswordManagerApp/<run>/index.html" - but the publish step below actually places it under
    # destination_dir: allure-report, so that redirect 404s (there's no /<run>/ at the site root). This
    # makes the redirect target ".../PasswordManagerApp/allure-report/<run>/index.html", which matches
    # where the file actually ends up.
    - name: Build Allure report
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        allure_history: allure-history
        allure_report: allure-report
        keep_reports: 20
        gh_pages: gh-pages
        report_url: https://dotnetappdev.github.io/PasswordManagerApp/allure-report

    # allure-report-action populates allure-history from the "gh-pages" checkout above (path: gh-pages),
    # which brings that checkout's .git along with it. Left in place, peaceiris/actions-gh-pages records
    # allure-report as a submodule gitlink instead of plain files, which has no .gitmodules entry and
    # breaks GitHub's own Pages build (fails checkout with "No url found for submodule path
    # 'allure-report'") - so the live site stops updating even though every workflow here reports success.
    #
    # sudo is required: allure-report-action runs inside a Docker container, so the files it writes into
    # allure-history/.git are root-owned - a plain `rm -rf` as the runner's non-root user fails with
    # "Permission denied" on every file, which fails this step (and so the whole job) even though every
    # actual test passed. (A run before this fix landed left allure-report as a stale gitlink on
    # gh-pages, which was cleaned up manually so this step's fix could take effect.)
    - name: Strip nested git metadata from Allure history
      if: always()
      run: sudo rm -rf allure-history/.git

    # destination_dir + keep_files so this coexists with the docs site (build-docs.yml), which also
    # publishes to gh-pages but at the branch root - without keep_files, each publish wipes the branch
    # and the two workflows would clobber each other.
    - name: Publish Allure report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always() && github.event_name == 'push'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
        destination_dir: allure-report
        keep_files: true

    - name: Upload Allure report artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: allure-report
        path: allure-history
        retention-days: 20

    # Surfaces the Allure dashboard right on the run's summary page so pass/fail results are one click
    # away instead of buried in raw dotnet test logs - shown even when tests failed (if: always()).
    - name: Add Allure report link to job summary
      if: always()
      run: |
        {
          echo "## Allure test dashboard"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo ""
            echo "📊 [View the live dashboard](https://dotnetappdev.github.io/PasswordManagerApp/allure-report/index.html) - updated with this run's results."
          else
            echo ""
            echo "📊 This run's results are attached above as the **allure-report** artifact - download it and open \`index.html\`."
            echo "Once merged, results publish to the [live dashboard](https://dotnetappdev.github.io/PasswordManagerApp/allure-report/index.html)."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

  # VaultGuard.Tests.Playwright has ~56 real assertion-based Blazor UI tests (CRUD flows, vaults,
  # categories, users, passkeys, settings) that self-host VaultGuard.Web and drive it with a real
  # browser via Expect() - separate from ScreenshotCaptureTests, which only captures images and runs in
  # screenshots.yml. These were never wired into any CI workflow, so they've been running nowhere. This
  # is a distinct, heavier setup (installs a real browser, self-hosts the Blazor app) so it runs as its
  # own job rather than folding into the `test` job above - it shows up as its own check, and a failure
  # here doesn't block the faster unit-test suite from reporting.
  blazor-ui-tests:
    runs-on: ubuntu-latest
    name: Run Blazor UI Tests (Playwright)

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # BlazorWebTestBase launches VaultGuard.Web as a separate process and builds it internally with
    # --no-restore (expecting restore to have already happened) - restore/build it explicitly here so
    # that internal --no-restore build actually succeeds.
    - name: Restore & build Playwright test project + VaultGuard.Web
      run: |
        dotnet restore VaultGuard.Tests.Playwright/VaultGuard.Tests.Playwright.csproj
        dotnet build VaultGuard.Tests.Playwright/VaultGuard.Tests.Playwright.csproj --no-restore -c Debug
        dotnet restore VaultGuard.Web/VaultGuard.Web.csproj
        dotnet build VaultGuard.Web/VaultGuard.Web.csproj --no-restore -c Debug

    - name: Install Playwright browser + OS deps
      run: pwsh VaultGuard.Tests.Playwright/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

    # Excludes ScreenshotCaptureTests (image capture only, no assertions - covered by screenshots.yml)
    # so this job runs every real assertion-based UI test class: ApplicationWorkflowTests,
    # CategoryAndTagCrudTests, PasswordItemCrudTests, UserManagementCrudTests, VaultCrudTests,
    # PasskeysAndSettingsTests, SeededDemoDataTests. Every one of those calls SaveEvidenceAsync at key
    # steps (SignInAsync, page loads, dialog opens, etc.), writing a screenshot into
    # --results-directory and attaching it to that test's result via TestContext.AddResultFile.
    - name: Run Blazor UI assertion tests
      env:
        HEADED: '0'
      run: dotnet test VaultGuard.Tests.Playwright/VaultGuard.Tests.Playwright.csproj --no-build -c Debug --filter "FullyQualifiedName!~ScreenshotCaptureTests" --results-directory ./blazor-ui-test-results --logger "trx;LogFileName=blazor-ui-tests.trx"

    # Not Allure-wired: Allure.MSTest requires the test class to derive from its base type, which
    # conflicts with Playwright's PageTest base class (see docs/TESTING.md) - dotnet-trx reporting only.
    - name: Publish Blazor UI Test Results
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Blazor UI Test Results (Playwright)
        path: '**/blazor-ui-tests.trx'
        reporter: dotnet-trx
        fail-on-error: true

    # if: always() so evidence from a failing run is downloadable too - that's the whole point of
    # SaveEvidenceAsync, seeing what the page actually looked like when an assertion failed.
    - name: Upload Blazor UI test screenshots
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: blazor-ui-test-screenshots
        path: blazor-ui-test-results/**/*.png
        if-no-files-found: warn
        retention-days: 20
