name: Build Android (Native)

# Builds the native Kotlin/Jetpack Compose Android app (VaultGuard.Android/) - NOT the MAUI app
# (VaultGuard.App), which build-maui.yml previously published as the release APK. build-maui.yml's
# Android publish/release steps are now disabled (Windows-head build validation only) in favor of
# this one - see its own comment for why.
on:
  push:
    branches: [ devmain, main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ devmain, main ]
  workflow_dispatch: {}

# See run-tests.yml's concurrency comment - cancels a stale in-flight run instead of piling up
# behind it. Safe here (no live deploy side effect to interrupt).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: VaultGuard.Android

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Explicit ref + full history: pull_request's default checkout is a synthetic merge commit that
      # doesn't exist in the branch's real history (bad tag target), and the release version-bump
      # below needs the full tag history, not the default shallow clone.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Derive version: from a git tag (v1.2.3), auto-incremented from the latest shared
      # release-vX.Y.Z tag on a merged PR into devmain (same scheme as build-wpf.yml/build-maui.yml/
      # deploy-api-smarterasp.yml/deploy-web-smarterasp.yml - see build-wpf.yml's "Set version"
      # comment), or 0.0.0-dev otherwise (plain branch pushes/other PRs - build validation only). ──
      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v(.+)$ ]]; then
            ver="${BASH_REMATCH[1]}"
            tag="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.base.ref }}" = "devmain" ]; then
            latest=$(git tag -l 'release-v*' | sed 's/^release-v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
            if [ -z "$latest" ]; then
              ver="1.0.0"
            else
              IFS='.' read -r major minor patch <<< "$latest"
              ver="$major.$minor.$((patch + 1))"
            fi
            tag="release-v$ver"
          else
            ver="0.0.0-dev"
            tag=""
          fi
          echo "VERSION=$ver" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $ver (tag: $tag)"

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: ${{ env.PROJECT_DIR }}

      # Debug build type (not Release): the app has no release signingConfig/keystore checked in, and
      # unlike the MAUI SDK (which auto-generates a debug keystore even for a Release-configuration
      # build), plain AGP only auto-signs the Debug build type - a Release build here would come out
      # unsigned and uninstallable as-is. Debug is directly sideloadable, matching what the previous
      # MAUI-built APK actually was in practice (debug-keystore signed).
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace -PversionName=${{ steps.ver.outputs.VERSION }}
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devmain')
        run: |
          mkdir -p publish/android
          cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" "publish/android/VaultGuardAndroid-${{ steps.ver.outputs.VERSION }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VaultGuard-Android-Native-${{ steps.ver.outputs.VERSION }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      # Only for the PR-merge case - a manual vX.Y.Z tag already exists (the user pushed it), so
      # there's nothing to tag here; the release step below just attaches the APK to that existing
      # tag's release. release-vX.Y.Z is shared with WPF/Web/API (see build-wpf.yml's "Tag release"
      # step comment, including why every push here is best-effort - GitHub unconditionally blocks
      # GITHUB_TOKEN from touching a ref pointing at a commit that modifies .github/workflows/**,
      # with no permission that unlocks it) - this checks whether a sibling job already pushed it and
      # skips instead of failing if so.
      - name: Tag release and create release branch
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devmain'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sha="${{ github.event.pull_request.head.sha }}"
          tag="${{ steps.ver.outputs.TAG }}"
          git fetch origin "refs/tags/$tag" 2>/dev/null || true
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists (created by a sibling app's release job for this same merge) - skipping."
          else
            git tag "$tag" "$sha"
            if ! git push origin "$tag"; then
              echo "::warning::Could not push tag $tag (likely blocked because this commit touches .github/workflows/**). Continuing; the release step will create it via the API instead."
            fi
          fi
          git fetch origin "refs/heads/release/$tag" 2>/dev/null || true
          if git rev-parse "refs/remotes/origin/release/$tag" >/dev/null 2>&1; then
            echo "release/$tag branch already exists - skipping."
          else
            git branch "release/$tag" "$sha"
            if ! git push origin "release/$tag"; then
              echo "::warning::Could not push branch release/$tag (likely blocked because this commit touches .github/workflows/**)."
            fi
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devmain')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: VaultGuard ${{ steps.ver.outputs.VERSION }}
          append_body: true
          body: |
            ### Android — v${{ steps.ver.outputs.VERSION }}
            - `VaultGuardAndroid-${{ steps.ver.outputs.VERSION }}.apk` — native Kotlin/Compose app, debug-signed sideload APK (not Play-Store signed)
          files: publish/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
