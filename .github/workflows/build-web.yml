name: Build Web (Blazor)

on:
  push:
    branches: [ devmain, main, develop ]
    tags:     [ 'v*' ]
    paths:
      - 'VaultGuard.Web/**'
      - 'VaultGuard.Models/**'
      - 'VaultGuard.Components.Shared/**'
      - 'VaultGuard.DAL/**'
      - 'VaultGuard.Services/**'
      - 'VaultGuard.Crypto/**'
      - 'VaultGuard.Imports/**'
      - 'VaultGuard.DAL.SqlServer/**'
      - 'VaultGuard.DAL.MySql/**'
      - 'VaultGuard.DAL.Postgres/**'
      - 'VaultGuard.DAL.SupaBase/**'
  pull_request:
    branches: [ devmain, main, develop ]
    paths:
      - 'VaultGuard.Web/**'
      - 'VaultGuard.Models/**'
      - 'VaultGuard.Components.Shared/**'
      - 'VaultGuard.DAL/**'
      - 'VaultGuard.Services/**'
      - 'VaultGuard.Crypto/**'
      - 'VaultGuard.Imports/**'
      - 'VaultGuard.DAL.SqlServer/**'
      - 'VaultGuard.DAL.MySql/**'
      - 'VaultGuard.DAL.Postgres/**'
      - 'VaultGuard.DAL.SupaBase/**'
  workflow_dispatch: {}

env:
  PROJECT: VaultGuard.Web/VaultGuard.Web.csproj
  PUBLISH_DIR: publish/web
  DOTNET_VERSION: '10.0.x'

jobs:
  build-web:
    runs-on: ubuntu-latest
    name: Build & Publish Blazor Web

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set version
        id: ver
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v(.+)$ ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: >
          dotnet build ${{ env.PROJECT }}
          --no-restore --configuration Release
          -p:Version=${{ steps.ver.outputs.VERSION }}

      - name: Test
        # VaultGuard.Web.Tests is never built by the "Build" step above (nothing here references it,
        # since it's the Tests project that references VaultGuard.Web, not the other way round), so
        # --no-build has nothing to run against - let dotnet test restore/build it itself. Also target
        # the .csproj explicitly rather than the bare directory: on the .NET 10 SDK, --no-build against
        # a directory path resolves to "The argument <dll> is invalid" instead of running the tests.
        run: |
          if [ -d "VaultGuard.Web.Tests" ]; then
            dotnet test VaultGuard.Web.Tests/VaultGuard.Web.Tests.csproj --configuration Release --logger "trx;LogFileName=web-tests.trx"
          else
            echo "No Web tests found, skipping"
          fi

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration Release --output ${{ env.PUBLISH_DIR }}
          -p:Version=${{ steps.ver.outputs.VERSION }}

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd ${{ env.PUBLISH_DIR }}
          zip -r ../VaultGuardWeb-${{ steps.ver.outputs.VERSION }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VaultGuard-Web-${{ steps.ver.outputs.VERSION }}
          path: publish/VaultGuardWeb-*.zip
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: VaultGuard ${{ steps.ver.outputs.VERSION }}
          body: |
            **VaultGuardWeb-${{ steps.ver.outputs.VERSION }}.zip** is the self-hosted Blazor web site (`VaultGuard.Web`) - unzip and run/deploy it to use VaultGuard in a browser. It is not the browser extension or the API.
          generate_release_notes: true
          files: publish/VaultGuardWeb-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
