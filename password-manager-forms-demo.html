<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Guard Dynamic Forms Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #2d2d2d;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .form-section {
            margin-bottom: 24px;
        }
        .form-section h3 {
            color: #ffffff;
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 600;
        }
        .field-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input, textarea, select {
            width: 100%;
            background: #404040;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 16px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #0078d4;
        }
        .add-field-btn {
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .add-field-btn:hover {
            background: #106ebe;
        }
        .add-more-btn {
            background: transparent;
            color: #0078d4;
            border: none;
            padding: 8px 0;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }
        .add-more-btn:hover {
            text-decoration: underline;
        }
        .custom-field {
            background: #353535;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #555;
        }
        .custom-field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .remove-btn {
            background: transparent;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
        }
        .field-type-selector {
            margin-bottom: 12px;
        }
        .tab-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .tab-btn {
            background: #404040;
            color: #e0e0e0;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #0078d4;
            color: white;
        }
        .form-panel {
            display: none;
        }
        .form-panel.active {
            display: block;
        }
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Vault Guard - Dynamic Forms</h2>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showForm('credit-card')">Credit Card</button>
            <button class="tab-btn" onclick="showForm('secure-note')">Secure Note</button>
            <button class="tab-btn" onclick="showForm('password')">Password</button>
            <button class="tab-btn" onclick="showForm('identity')">Identity</button>
            <button class="tab-btn" onclick="showForm('api')">API Credentials</button>
        </div>

        <!-- Credit Card Form -->
        <div id="credit-card" class="form-panel active">
            <div class="form-section">
                <h3>Credit Card</h3>
                
                <div class="field-group">
                    <label>cardholder name</label>
                    <input type="text" placeholder="Enter cardholder name">
                </div>
                
                <div class="field-group">
                    <label>type</label>
                    <select>
                        <option>Select card type</option>
                        <option>Visa</option>
                        <option>MasterCard</option>
                        <option>American Express</option>
                    </select>
                </div>
                
                <div class="field-group">
                    <label>number</label>
                    <input type="text" placeholder="Enter card number">
                </div>
                
                <div class="field-group">
                    <label>verification number</label>
                    <input type="text" placeholder="Enter CVV">
                </div>
                
                <div class="field-group">
                    <label>expiry date</label>
                    <input type="text" placeholder="MM/YYYY">
                </div>
                
                <div class="field-group">
                    <label>valid from</label>
                    <input type="text" placeholder="MM/YYYY">
                </div>
                
                <button class="add-field-btn" onclick="addCustomField('credit-card')">
                    + add another field
                </button>
                
                <div id="credit-card-custom-fields"></div>
            </div>
        </div>

        <!-- Secure Note Form -->
        <div id="secure-note" class="form-panel">
            <div class="form-section">
                <h3>Secure Note</h3>
                
                <div class="field-group">
                    <textarea rows="6" placeholder="Add any notes about this item here."></textarea>
                </div>
                
                <button class="add-more-btn" onclick="addCustomField('secure-note')">+ add more</button><br>
                <button class="add-more-btn" onclick="addLocationField()">+ add a location</button>
                
                <div id="secure-note-custom-fields"></div>
            </div>
        </div>

        <!-- Password Form -->
        <div id="password" class="form-panel">
            <div class="form-section">
                <h3>Password</h3>
                
                <div class="field-group">
                    <label>username</label>
                    <input type="text" placeholder="Enter username">
                </div>
                
                <div class="field-group">
                    <label>password</label>
                    <input type="password" placeholder="Enter password">
                </div>
                
                <button class="add-more-btn" onclick="addWebsiteField()">+ add website</button><br>
                <button class="add-more-btn" onclick="addCustomField('password')">+ add more</button>
                
                <div class="field-group">
                    <label>notes</label>
                    <textarea rows="3" placeholder="Add any notes about this item here."></textarea>
                </div>
                
                <div id="password-custom-fields"></div>
            </div>
        </div>

        <!-- Identity Form -->
        <div id="identity" class="form-panel">
            <div class="form-section">
                <h3>Identity</h3>
                <h4 style="color: #e0e0e0; font-size: 14px; margin-bottom: 16px;">Identification</h4>
                
                <div class="field-group">
                    <label>first name</label>
                    <input type="text" placeholder="Enter first name">
                </div>
                
                <div class="field-group">
                    <label>initial</label>
                    <input type="text" placeholder="Enter initial">
                </div>
                
                <div class="field-group">
                    <label>last name</label>
                    <input type="text" placeholder="Enter last name">
                </div>
                
                <div class="field-group">
                    <label>gender</label>
                    <input type="text" placeholder="Enter gender">
                </div>
                
                <div class="field-group">
                    <label>birth date</label>
                    <input type="date">
                </div>
                
                <div class="field-group">
                    <label>occupation</label>
                    <input type="text" placeholder="Enter occupation">
                </div>
                
                <div class="field-group">
                    <label>company</label>
                    <input type="text" placeholder="Enter company">
                </div>
                
                <div class="field-group">
                    <label>department</label>
                    <input type="text" placeholder="Enter department">
                </div>
                
                <div class="field-group">
                    <label>job title</label>
                    <input type="text" placeholder="Enter job title">
                </div>
                
                <div id="identity-custom-fields"></div>
            </div>
        </div>

        <!-- API Credentials Form -->
        <div id="api" class="form-panel">
            <div class="form-section">
                <h3>API Credentials</h3>
                
                <div class="field-group">
                    <label>username</label>
                    <input type="text" placeholder="Enter username">
                </div>
                
                <div class="field-group">
                    <label>credential</label>
                    <input type="password" placeholder="Enter credential">
                </div>
                
                <div class="field-group">
                    <label>type</label>
                    <input type="text" placeholder="Enter type">
                </div>
                
                <div class="field-group">
                    <label>filename</label>
                    <input type="text" placeholder="Enter filename">
                </div>
                
                <div class="field-group">
                    <label>valid from</label>
                    <input type="date">
                </div>
                
                <div class="field-group">
                    <label>expires</label>
                    <input type="date">
                </div>
                
                <div class="field-group">
                    <label>hostname</label>
                    <input type="text" placeholder="Enter hostname">
                </div>
                
                <button class="add-field-btn" onclick="addCustomField('api')">
                    + add another field
                </button>
                
                <div id="api-custom-fields"></div>
            </div>
        </div>
    </div>

    <script>
        function showForm(formType) {
            // Hide all forms
            document.querySelectorAll('.form-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            
            // Remove active class from all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected form
            document.getElementById(formType).classList.add('active');
            
            // Add active class to clicked button
            event.target.classList.add('active');
        }

        function addCustomField(formType) {
            const container = document.getElementById(formType + '-custom-fields');
            const fieldId = 'custom-field-' + Date.now();
            
            const customField = document.createElement('div');
            customField.className = 'custom-field';
            customField.innerHTML = `
                <div class="custom-field-header">
                    <input type="text" placeholder="Field name" style="flex: 1; margin-right: 12px;">
                    <button class="remove-btn" onclick="removeCustomField('${fieldId}')">🗑️</button>
                </div>
                <div class="field-type-selector">
                    <select onchange="updateFieldType(this, '${fieldId}')">
                        <option value="text">Text</option>
                        <option value="password">Password</option>
                        <option value="date">Date</option>
                        <option value="number">Number</option>
                        <option value="email">Email</option>
                        <option value="url">URL</option>
                        <option value="textarea">Text Area</option>
                    </select>
                </div>
                <div class="field-value" id="${fieldId}-value">
                    <input type="text" placeholder="Enter value">
                </div>
            `;
            customField.id = fieldId;
            container.appendChild(customField);
        }

        function addWebsiteField() {
            const container = document.getElementById('password-custom-fields');
            const fieldId = 'website-field-' + Date.now();
            
            const websiteField = document.createElement('div');
            websiteField.className = 'custom-field';
            websiteField.innerHTML = `
                <div class="custom-field-header">
                    <input type="text" value="Website" style="flex: 1; margin-right: 12px;">
                    <button class="remove-btn" onclick="removeCustomField('${fieldId}')">🗑️</button>
                </div>
                <div class="field-value">
                    <input type="url" placeholder="https://example.com">
                </div>
            `;
            websiteField.id = fieldId;
            container.appendChild(websiteField);
        }

        function addLocationField() {
            const container = document.getElementById('secure-note-custom-fields');
            const fieldId = 'location-field-' + Date.now();
            
            const locationField = document.createElement('div');
            locationField.className = 'custom-field';
            locationField.innerHTML = `
                <div class="custom-field-header">
                    <input type="text" value="Location" style="flex: 1; margin-right: 12px;">
                    <button class="remove-btn" onclick="removeCustomField('${fieldId}')">🗑️</button>
                </div>
                <div class="field-value">
                    <input type="text" placeholder="Enter location">
                </div>
            `;
            locationField.id = fieldId;
            container.appendChild(locationField);
        }

        function removeCustomField(fieldId) {
            document.getElementById(fieldId).remove();
        }

        function updateFieldType(select, fieldId) {
            const valueContainer = document.getElementById(fieldId + '-value');
            const fieldType = select.value;
            
            let inputHtml = '';
            switch(fieldType) {
                case 'password':
                    inputHtml = '<input type="password" placeholder="Enter password">';
                    break;
                case 'date':
                    inputHtml = '<input type="date">';
                    break;
                case 'number':
                    inputHtml = '<input type="number" placeholder="Enter number">';
                    break;
                case 'email':
                    inputHtml = '<input type="email" placeholder="Enter email">';
                    break;
                case 'url':
                    inputHtml = '<input type="url" placeholder="Enter URL">';
                    break;
                case 'textarea':
                    inputHtml = '<textarea rows="3" placeholder="Enter text"></textarea>';
                    break;
                default:
                    inputHtml = '<input type="text" placeholder="Enter value">';
            }
            
            valueContainer.innerHTML = inputHtml;
        }
    </script>
</body>
</html>
