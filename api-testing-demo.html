<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Testing Interface Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        .api-testing-container {
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .request-panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #dee2e6;
            background: white;
        }

        .response-panel {
            height: 300px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .collection-item {
            padding: 8px 16px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .collection-item:hover {
            background: #e9ecef;
        }

        .collection-item.active {
            background: #007bff;
            color: white;
        }

        .request-item {
            padding: 6px 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9em;
        }

        .request-item:hover {
            background: #e9ecef;
        }

        .request-item.active {
            background: #007bff;
            color: white;
        }

        .method-badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75em;
            font-weight: bold;
            margin-right: 8px;
        }

        .method-get { background: #28a745; color: white; }
        .method-post { background: #007bff; color: white; }
        .method-put { background: #ffc107; color: black; }
        .method-delete { background: #dc3545; color: white; }
        .method-patch { background: #6c757d; color: white; }

        .send-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }

        .send-button:hover {
            background: #0056b3;
        }

        .send-button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .request-url-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .method-dropdown {
            width: 120px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        .url-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        .response-tabs {
            display: flex;
            border-bottom: 1px solid #dee2e6;
            background: white;
        }

        .response-tab {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .response-tab.active {
            border-bottom-color: #007bff;
            color: #007bff;
            font-weight: bold;
        }

        .response-content {
            flex: 1;
            overflow: auto;
            padding: 15px;
            background: white;
        }

        .add-button {
            background: #28a745;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }

        .add-button:hover {
            background: #218838;
        }

        .sidebar-header {
            padding: 15px;
            background: #e9ecef;
            border-bottom: 1px solid #dee2e6;
            font-weight: bold;
        }

        .key-value-pair {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .key-value-pair input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        .remove-button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.7em;
        }

        .textarea-large {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 15px;
        }

        .tab {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            border-bottom-color: #007bff;
            color: #007bff;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .status-success {
            color: #28a745;
            font-weight: bold;
        }

        .status-error {
            color: #dc3545;
            font-weight: bold;
        }

        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #e9ecef;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="api-testing-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                Collections & Requests
                <button class="add-button" onclick="showAddCollectionModal()" style="float: right;">+ Collection</button>
            </div>
            
            <div id="collections-list">
                <!-- Collection 1 -->
                <div class="collection-item active" onclick="selectCollection(1)">
                    <div>
                        <span>📁</span> My API Tests
                    </div>
                    <div>
                        <button class="add-button" onclick="showAddRequestModal(1)">+ Request</button>
                    </div>
                </div>
                
                <div class="request-item active" onclick="selectRequest(1)">
                    <div>
                        <span class="method-badge method-get">GET</span>
                        Get Users
                    </div>
                </div>
                
                <div class="request-item" onclick="selectRequest(2)">
                    <div>
                        <span class="method-badge method-post">POST</span>
                        Create User
                    </div>
                </div>
                
                <!-- Collection 2 -->
                <div class="collection-item" onclick="selectCollection(2)">
                    <div>
                        <span>🔐</span> Vault Guard API
                    </div>
                    <div>
                        <button class="add-button" onclick="showAddRequestModal(2)">+ Request</button>
                    </div>
                </div>
                
                <div class="request-item" onclick="selectRequest(3)">
                    <div>
                        <span class="method-badge method-get">GET</span>
                        Get API Keys
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Request Configuration Panel -->
            <div class="request-panel">
                <h4 id="request-title">Get Users</h4>
                
                <!-- Request URL Row -->
                <div class="request-url-row">
                    <select id="method-select" class="method-dropdown">
                        <option value="GET" selected>GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                        <option value="PATCH">PATCH</option>
                    </select>
                    <input type="text" id="url-input" class="url-input" placeholder="Enter request URL" 
                           value="https://jsonplaceholder.typicode.com/users" />
                    <button class="send-button" onclick="sendRequest()">Send</button>
                </div>

                <!-- Tabs for different sections -->
                <div class="tabs">
                    <button class="tab active" onclick="showTab('headers')">Headers</button>
                    <button class="tab" onclick="showTab('body')">Body</button>
                    <button class="tab" onclick="showTab('params')">Query Params</button>
                </div>

                <div id="headers-tab" class="tab-content active">
                    <h6>Headers</h6>
                    <div id="headers-list">
                        <div class="key-value-pair">
                            <input type="text" placeholder="Header name" value="Content-Type" />
                            <input type="text" placeholder="Header value" value="application/json" />
                            <button class="remove-button" onclick="removeHeader(this)">×</button>
                        </div>
                    </div>
                    <button class="add-button" onclick="addHeader()">+ Add Header</button>
                </div>

                <div id="body-tab" class="tab-content">
                    <h6>Request Body</h6>
                    <select class="form-control" id="content-type">
                        <option value="application/json" selected>JSON</option>
                        <option value="application/xml">XML</option>
                        <option value="text/plain">Text</option>
                        <option value="application/x-www-form-urlencoded">Form Data</option>
                    </select>
                    <textarea id="request-body" class="textarea-large" 
                              placeholder="Enter request body content">{
  "name": "John Doe",
  "email": "john@example.com"
}</textarea>
                </div>

                <div id="params-tab" class="tab-content">
                    <h6>Query Parameters</h6>
                    <div id="params-list">
                        <div class="key-value-pair">
                            <input type="text" placeholder="Parameter name" value="page" />
                            <input type="text" placeholder="Parameter value" value="1" />
                            <button class="remove-button" onclick="removeParam(this)">×</button>
                        </div>
                    </div>
                    <button class="add-button" onclick="addQueryParam()">+ Add Parameter</button>
                </div>
            </div>

            <!-- Response Panel -->
            <div class="response-panel">
                <div class="response-tabs">
                    <button class="response-tab active" onclick="showResponseTab('response')">Response</button>
                    <button class="response-tab" onclick="showResponseTab('headers-resp')">Headers</button>
                    <button class="response-tab" onclick="showResponseTab('info')">Info</button>
                </div>
                
                <div class="response-content">
                    <div id="response-tab" class="tab-content active">
                        <pre id="response-body">{
  "message": "Click Send to execute the request",
  "status": "Ready"
}</pre>
                    </div>
                    <div id="headers-resp-tab" class="tab-content">
                        <pre id="response-headers">No response headers yet</pre>
                    </div>
                    <div id="info-tab" class="tab-content">
                        <div id="response-info">
                            <p><strong>Status:</strong> <span id="status-code">-</span></p>
                            <p><strong>Time:</strong> <span id="response-time">-</span></p>
                            <p><strong>Size:</strong> <span id="response-size">-</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentRequest = 1;
        let currentCollection = 1;
        let activeTab = 'headers';
        let activeResponseTab = 'response';

        // Sample data
        const requests = {
            1: {
                name: 'Get Users',
                method: 'GET',
                url: 'https://jsonplaceholder.typicode.com/users',
                headers: [{'Content-Type': 'application/json'}],
                body: '',
                params: [{'page': '1'}]
            },
            2: {
                name: 'Create User',
                method: 'POST',
                url: 'https://jsonplaceholder.typicode.com/users',
                headers: [{'Content-Type': 'application/json'}],
                body: '{\n  "name": "John Doe",\n  "email": "john@example.com"\n}',
                params: []
            },
            3: {
                name: 'Get API Keys',
                method: 'GET',
                url: 'http://localhost:5000/api/apikeys',
                headers: [{'X-API-Key': 'your-api-key-here'}],
                body: '',
                params: []
            }
        };

        function selectCollection(id) {
            currentCollection = id;
            // Update UI to show active collection
            document.querySelectorAll('.collection-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // Find and activate the clicked collection item
            const collectionItems = document.querySelectorAll('.collection-item');
            if (collectionItems[id - 1]) {
                collectionItems[id - 1].classList.add('active');
            }
        }

        function selectRequest(id) {
            currentRequest = id;
            const request = requests[id];
            
            // Update UI to show active request
            document.querySelectorAll('.request-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // Find and activate the clicked request item
            const requestItems = document.querySelectorAll('.request-item');
            if (requestItems[id - 1]) {
                requestItems[id - 1].classList.add('active');
            }
            
            // Load request data
            document.getElementById('request-title').textContent = request.name;
            document.getElementById('method-select').value = request.method;
            document.getElementById('url-input').value = request.url;
            document.getElementById('request-body').value = request.body;
            
            // Load headers
            const headersList = document.getElementById('headers-list');
            headersList.innerHTML = '';
            request.headers.forEach(header => {
                Object.keys(header).forEach(key => {
                    addHeaderRow(key, header[key]);
                });
            });
            
            // Load params
            const paramsList = document.getElementById('params-list');
            paramsList.innerHTML = '';
            request.params.forEach(param => {
                Object.keys(param).forEach(key => {
                    addParamRow(key, param[key]);
                });
            });
        }

        function showTab(tabName) {
            activeTab = tabName;
            
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');
            
            // Find and activate the clicked tab button
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                if (tab.textContent.toLowerCase().replace(' ', '') === tabName.replace('-', '')) {
                    tab.classList.add('active');
                }
            });
        }

        function showResponseTab(tabName) {
            activeResponseTab = tabName;
            
            // Hide all response tabs
            document.querySelectorAll('.response-content .tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.response-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');
            
            // Find and activate the clicked response tab button
            const responseTabs = document.querySelectorAll('.response-tab');
            responseTabs.forEach(tab => {
                if (tab.textContent.toLowerCase() === tabName.replace('-resp', '').replace('-', ' ')) {
                    tab.classList.add('active');
                }
            });
        }

        function addHeader() {
            addHeaderRow('', '');
        }

        function addHeaderRow(key, value) {
            const headersList = document.getElementById('headers-list');
            const div = document.createElement('div');
            div.className = 'key-value-pair';
            div.innerHTML = `
                <input type="text" placeholder="Header name" value="${key}" />
                <input type="text" placeholder="Header value" value="${value}" />
                <button class="remove-button" onclick="removeHeader(this)">×</button>
            `;
            headersList.appendChild(div);
        }

        function removeHeader(button) {
            button.parentElement.remove();
        }

        function addQueryParam() {
            addParamRow('', '');
        }

        function addParamRow(key, value) {
            const paramsList = document.getElementById('params-list');
            const div = document.createElement('div');
            div.className = 'key-value-pair';
            div.innerHTML = `
                <input type="text" placeholder="Parameter name" value="${key}" />
                <input type="text" placeholder="Parameter value" value="${value}" />
                <button class="remove-button" onclick="removeParam(this)">×</button>
            `;
            paramsList.appendChild(div);
        }

        function removeParam(button) {
            button.parentElement.remove();
        }

        async function sendRequest() {
            const method = document.getElementById('method-select').value;
            const url = document.getElementById('url-input').value;
            const body = document.getElementById('request-body').value;
            
            const sendButton = document.querySelector('.send-button');
            sendButton.textContent = 'Sending...';
            sendButton.disabled = true;
            
            const startTime = Date.now();
            
            try {
                // Collect headers
                const headers = {};
                document.querySelectorAll('#headers-list .key-value-pair').forEach(pair => {
                    const inputs = pair.querySelectorAll('input');
                    if (inputs[0].value && inputs[1].value) {
                        headers[inputs[0].value] = inputs[1].value;
                    }
                });
                
                // Collect query params
                const params = new URLSearchParams();
                document.querySelectorAll('#params-list .key-value-pair').forEach(pair => {
                    const inputs = pair.querySelectorAll('input');
                    if (inputs[0].value && inputs[1].value) {
                        params.append(inputs[0].value, inputs[1].value);
                    }
                });
                
                let requestUrl = url;
                if (params.toString()) {
                    requestUrl += (url.includes('?') ? '&' : '?') + params.toString();
                }
                
                const options = {
                    method: method,
                    headers: headers
                };
                
                if (method !== 'GET' && body) {
                    options.body = body;
                }
                
                const response = await fetch(requestUrl, options);
                const responseTime = Date.now() - startTime;
                const responseText = await response.text();
                
                // Update response display
                document.getElementById('response-body').textContent = responseText;
                document.getElementById('response-headers').textContent = JSON.stringify(
                    Object.fromEntries(response.headers.entries()), 
                    null, 
                    2
                );
                
                const statusElement = document.getElementById('status-code');
                statusElement.textContent = `${response.status} ${response.statusText}`;
                statusElement.className = response.ok ? 'status-success' : 'status-error';
                
                document.getElementById('response-time').textContent = `${responseTime} ms`;
                document.getElementById('response-size').textContent = `${responseText.length} bytes`;
                
                // Show response tab
                showResponseTab('response');
                
            } catch (error) {
                document.getElementById('response-body').textContent = `Error: ${error.message}`;
                document.getElementById('status-code').textContent = 'Error';
                document.getElementById('status-code').className = 'status-error';
                showResponseTab('response');
            } finally {
                sendButton.textContent = 'Send';
                sendButton.disabled = false;
            }
        }

        function showAddCollectionModal() {
            alert('Add Collection modal would open here');
        }

        function showAddRequestModal(collectionId) {
            alert(`Add Request modal for collection ${collectionId} would open here`);
        }

        // Initialize with first request selected
        selectRequest(1);
    </script>
</body>
</html>
