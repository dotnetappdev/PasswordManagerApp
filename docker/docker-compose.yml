version: '3.8'

services:
  # SQL Server 2022 Developer Edition
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: passwordmanager-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-YourStrong@Password123}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - passwordmanager-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SQL_SA_PASSWORD:-YourStrong@Password123}" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Vault Guard Web API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: passwordmanager-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_HTTPS_PORT=443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD:-}
      - DatabaseProvider=SqlServer
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=VaultGuardDB;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStrong@Password123};TrustServerCertificate=true;MultipleActiveResultSets=true
    ports:
      - "51650:443"
      - "51651:80"
    volumes:
      - ./certs:/https:ro
      - api-logs:/app/logs
    networks:
      - passwordmanager-network
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:80/health || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Vault Guard Blazor Web App
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: passwordmanager-web
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:80
      - DatabaseProvider=SqlServer
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=VaultGuardDB;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStrong@Password123};TrustServerCertificate=true;MultipleActiveResultSets=true
    ports:
      - "8080:80"
    volumes:
      - web-logs:/app/logs
    networks:
      - passwordmanager-network
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:80/health || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy (optional — provides unified entry point on port 80)
  nginx:
    image: nginx:alpine
    container_name: passwordmanager-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - passwordmanager-network
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local
  api-logs:
    driver: local
  web-logs:
    driver: local

networks:
  passwordmanager-network:
    driver: bridge
