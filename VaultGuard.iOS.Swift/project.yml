# XcodeGen spec — run `xcodegen generate` (or open in Xcode 15+) to produce VaultGuard.xcodeproj.
name: VaultGuard
options:
  bundleIdPrefix: com.vaultguard
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  VaultGuard:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VaultGuard
      - path: Setup
      - path: Shared
    dependencies:
      - target: VaultGuardAutoFill
    info:
      path: VaultGuard/Info.plist
      properties:
        CFBundleDisplayName: VaultGuard
        UILaunchScreen: {}
        NSCameraUsageDescription: "VaultGuard uses the camera to scan QR codes for authenticator (TOTP) secrets and login."
        NSFaceIDUsageDescription: "VaultGuard uses Face ID to unlock your vault quickly without retyping your master password."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaultguard.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: VaultGuard/VaultGuard.entitlements

  # AutoFill Credential Provider extension — lets VaultGuard fill logins system-wide.
  VaultGuardAutoFill:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AutoFillExtension
      - path: Shared
    info:
      path: AutoFillExtension/Info.plist
      properties:
        CFBundleDisplayName: VaultGuard AutoFill
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaultguard.app.autofill
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: AutoFillExtension/AutoFill.entitlements
