# XcodeGen spec — run `xcodegen generate` (or open in Xcode 15+) to produce VaultGuard.xcodeproj.
name: VaultGuard
options:
  bundleIdPrefix: com.vaultguard
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  VaultGuard:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VaultGuard
      - path: Setup
    info:
      path: VaultGuard/Info.plist
      properties:
        CFBundleDisplayName: VaultGuard
        UILaunchScreen: {}
        NSCameraUsageDescription: "VaultGuard uses the camera to scan QR codes for authenticator (TOTP) secrets and login."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaultguard.app
        TARGETED_DEVICE_FAMILY: "1,2"
